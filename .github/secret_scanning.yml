# GitHub Secret Scanning exclusions.
#
# WHY THIS FILE EXISTS -- false positive, there is no real secret in this repo:
# GitHub Push Protection reports a "Mistral AI API Key" inside the vendored
# trees excluded below. The matched text is not a key: it is the name of a
# Mistral-3 multimodal model class in sglang, and that name is exactly 32
# alphanumeric characters long. Mistral API keys are 32-character base62
# strings, so the built-in detector pattern matches the class name by accident.
#
# Nothing under sglang/ or verl/ is project code -- both are unmodified
# third-party checkouts, so no project credential can ever live there.
# Verified on 2026-09-17 by scanning the whole repo for key assignments.
paths-ignore:
  - "sglang/**"
  - "verl/**"
