# GrowMTP: detached draft-path reconstruction, DCA loss, and VGM.
algorithm.adv_estimator: grpo
algorithm.use_kl_in_reward: false
data.prompt_key: prompt
data.train_batch_size: 64
data.max_prompt_length: 1024
data.filter_overlong_prompts: false
data.truncation: left
data.shuffle: true
data.seed: 1
actor_rollout_ref.model.use_remove_padding: true
actor_rollout_ref.model.enable_gradient_checkpointing: true
actor_rollout_ref.model.use_fused_kernels: true
actor_rollout_ref.model.fused_kernel_options.impl_backend: triton
actor_rollout_ref.model.mtp.enable: true
actor_rollout_ref.model.mtp.enable_train: true
actor_rollout_ref.model.mtp.enable_rollout: true
actor_rollout_ref.model.mtp.detach_encoder: true
actor_rollout_ref.model.mtp.speculative_algorithm: EAGLE
actor_rollout_ref.model.mtp.speculative_eagle_topk: 1
++actor_rollout_ref.model.mtp.growmtp: true
++actor_rollout_ref.model.mtp.chunk_size: 1024
++actor_rollout_ref.model.mtp.vocab_chunk_size: 256
++actor_rollout_ref.model.mtp.warmup_steps: 10
++actor_rollout_ref.model.mtp.min_lr_ratio: 0.1
++actor_rollout_ref.model.mtp.teacher_topk: 64
actor_rollout_ref.actor.optim.lr: 0.000001
actor_rollout_ref.actor.ppo_mini_batch_size: 64
actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1
actor_rollout_ref.actor.use_kl_loss: true
actor_rollout_ref.actor.kl_loss_coef: 0.01
actor_rollout_ref.actor.kl_loss_type: low_var_kl
actor_rollout_ref.actor.clip_ratio: 0.2
actor_rollout_ref.actor.clip_ratio_low: 0.2
actor_rollout_ref.actor.clip_ratio_high: 0.2
actor_rollout_ref.actor.loss_agg_mode: token-mean
actor_rollout_ref.actor.policy_loss.loss_mode: asym
++actor_rollout_ref.actor.policy_loss.negative_advantage_weight: 0.5
actor_rollout_ref.actor.use_torch_compile: false
actor_rollout_ref.actor.strategy: fsdp2
actor_rollout_ref.actor.use_dynamic_bsz: true
actor_rollout_ref.actor.ppo_max_token_len_per_gpu: 32768
actor_rollout_ref.actor.checkpoint.save_contents: [model, optimizer, extra, hf_model]
actor_rollout_ref.actor.fsdp_config.fsdp_size: -1
actor_rollout_ref.actor.fsdp_config.reshard_after_forward: true
actor_rollout_ref.actor.fsdp_config.param_offload: false
actor_rollout_ref.actor.fsdp_config.optimizer_offload: false
actor_rollout_ref.actor.fsdp_config.ulysses_sequence_parallel_size: 1
actor_rollout_ref.ref.strategy: fsdp2
actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 1
actor_rollout_ref.ref.log_prob_max_token_len_per_gpu: 32768
actor_rollout_ref.ref.fsdp_config.param_offload: false
actor_rollout_ref.ref.fsdp_config.reshard_after_forward: true
actor_rollout_ref.ref.fsdp_config.ulysses_sequence_parallel_size: 1
actor_rollout_ref.ref.use_torch_compile: false
actor_rollout_ref.rollout.name: sglang
actor_rollout_ref.rollout.ignore_eos: false
actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 1
actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu: 32768
actor_rollout_ref.rollout.tensor_model_parallel_size: 1
actor_rollout_ref.rollout.gpu_memory_utilization: 0.6
actor_rollout_ref.rollout.n: 8
actor_rollout_ref.rollout.temperature: 1.0
actor_rollout_ref.rollout.top_p: 1.0
actor_rollout_ref.rollout.top_k: -1
actor_rollout_ref.rollout.val_kwargs.do_sample: true
actor_rollout_ref.rollout.val_kwargs.n: 16
actor_rollout_ref.rollout.val_kwargs.temperature: 1.0
actor_rollout_ref.rollout.val_kwargs.top_p: 0.7
actor_rollout_ref.rollout.enable_chunked_prefill: true
actor_rollout_ref.rollout.max_num_batched_tokens: 32768
actor_rollout_ref.rollout.free_cache_engine: true
actor_rollout_ref.rollout.enforce_eager: false
actor_rollout_ref.rollout.enable_prefix_caching: false
++actor_rollout_ref.rollout.engine_kwargs.sglang.disable_radix_cache: true
++actor_rollout_ref.rollout.engine_kwargs.sglang.disable_overlap_schedule: true
++actor_rollout_ref.rollout.engine_kwargs.sglang.max_running_requests: 72
trainer.critic_warmup: 0
trainer.logger: [console]
trainer.project_name: growmtp
trainer.experiment_name: growmtp
trainer.balance_batch: false
trainer.val_before_train: false
trainer.save_freq: 50
trainer.test_freq: 50
trainer.resume_mode: auto
trainer.total_epochs: 100
